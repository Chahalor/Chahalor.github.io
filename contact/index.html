<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Contact</title>
	<style>
		body {
			font-family: sans-serif;
			background-color: #121212;
			color: #f0f0f0;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 2rem;
		}

		h1 {
			margin-bottom: 2rem;
			color: #00ffaa;
		}

		ul {
			list-style: none;
			padding: 0;
			width: 100%;
			max-width: 600px;
		}

		li {
			margin: 1rem 0;
			border-radius: 10px;
			background: #1e1e1e;
			transition: background 0.3s, transform 0.2s;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
		}

		li:hover {
			background: #2c2c2c;
			transform: scale(1.01);
		}

		li a {
			display: block;
			width: 100%;
			height: 100%;
			color: #00ccff;
			text-decoration: none;
			padding: 1.2rem;
			font-weight: bold;
			border-radius: 10px;
		}

		li a:hover {
			color: #00ffaa;
		}
	</style>
</head>
<body>
	<h1>Mes Scripts Disponibles</h1>
	<ul>
		<li><a href="./github"> Github</a></li> <!-- add github logo -->
		<li><a href="./discord"> Discord</a></li>
		<li><a href="./mail"> Mail</a></li>
		<!-- <li><a href="https://github.com/Chahalor" target="_blank"> more to come...</a></li> -->
	</ul>
</body>
</html>
